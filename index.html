const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoOf(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoOf(d)};
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const fmtDate=iso=>{if(!iso)return '—';const [y,m,d]=String(iso).slice(0,10).split('-');return `${d}/${m}/${y}`};
const fmtTs=ts=>ts?new Date(ts).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}):'Jamais';
const lastMonths=n=>{const out=[];const d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(`${x.getFullYear()}-${pad(x.getMonth()+1)}`)}return out};
const monthLabel=k=>MS[+k.slice(5,7)-1];

const periodRange=p=>{const t=today();if(p==='month')return [t.slice(0,7)+'-01',t];if(p==='30d')return [addDays(t,-29),t];if(p==='year')return [t.slice(0,4)+'-01-01',t];return ['0000-00-00','9999-99-99']};

/* ============ CSV ============ */
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const cnt=c=>(first.split(c).length-1);
  const delim=cnt(';')>cnt(',')?';':cnt('\t')>cnt(',')?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  const clean=rows.filter(r=>r.some(x=>String(x).trim()!==''));
  const hi=clean.findIndex(r=>r.filter(x=>String(x).trim()!=='').length>=3);
  if(hi<0)return {headers:[],rows:[]};
  const headers=clean[hi].map(h=>String(h).trim());
  return {headers,rows:clean.slice(hi+1).map(r=>headers.map((_,i)=>String(r[i]??'').trim())).filter(r=>r.some(x=>x))};
}
function toCSV(rows,cols){
  const esc=v=>{v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [cols.map(c=>esc(c.h)).join(','),...rows.map(r=>cols.map(c=>esc(typeof c.v==='function'?c.v(r):r[c.v])).join(','))].join('\n');
}
function num(s){
  if(typeof s==='number')return s;
  let t=String(s||'').replace(/[^\d,.\-]/g,'');if(!t)return 0;
  const lc=t.lastIndexOf(','),ld=t.lastIndexOf('.');
  if(lc>-1&&ld>-1)t=lc>ld?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');
  else if(lc>-1)t=/,\d{1,2}$/.test(t)?t.replace(',','.'):t.replace(/,/g,'');
  const n=parseFloat(t);return isNaN(n)?0:n;
}
function toISO(s){
  s=String(s||'').trim();if(!s)return today();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);
  if(m){let a=+m[1],b=+m[2];const y=m[3];let mo=a,d=b;if(a>12){d=a;mo=b}return `${y}-${pad(mo)}-${pad(d)}`}
  const t=Date.parse(s);return isNaN(t)?today():isoOf(new Date(t));
}

async function callBackend(settings,path,body){
  if(!settings.backendUrl)throw new Error('NO_BACKEND');
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),45000);
  try{
    const res=await fetch(settings.backendUrl.replace(/\/+$/,'')+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(settings.accessKey?{Authorization:'Bearer '+settings.accessKey}:{})},body:body?JSON.stringify(body):undefined,signal:ctrl.signal});
    const j=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(j.error||('Erreur HTTP '+res.status));
    return j;
  }finally{clearTimeout(to)}
}
function explainErr(e){
  if(e.message==='NO_BACKEND')return 'Aucune adresse de backend n’est renseignée.';
  if(e.name==='AbortError')return 'Le backend n’a pas répondu à temps.';
  if(e instanceof TypeError)return 'Backend injoignable : adresse incorrecte, serveur arrêté, origine non autorisée (CORS), ou page d’aperçu qui bloque les connexions externes.';
  return e.message;
}

function LineChart({labels,series,fmt,h=230}){
  const [ref,W]=useWidth();const [hv,setHv]=useState(null);

  const x=i=>pl+(labels.length<2?(W-pl-pr)/2:i*(W-pl-pr)/(labels.length-1));
  const y=v=>pt+(h-pt-pb)*(1-v/max);
  const ticks=[0,.25,.5,.75,1].map(t=>t*max);
  const path=s=>s.vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  return <div className="chart" ref={ref} style={{position:'relative'}}>
    <svg width={W} height={h} role="img" aria-label={'Graphique : '+series.map(s=>s.name).join(', ')} onMouseLeave={()=>setHv(null)}>

function Donut({data,fmt}){
  const total=sum(data,d=>d.v)||1;let acc=0;const R=52,C=2*Math.PI*R;

      {data.map((d,i)=>{const len=d.v/total*C;const el=<circle key={i} cx="74" cy="74" r={R} fill="none" stroke={d.color} strokeWidth="24" strokeDasharray={`${len} ${C-len}`} strokeDashoffset={-acc} transform="rotate(-90 74 74)"/>;acc+=len;return el})}
      <text x="74" y="72" textAnchor="middle" fontSize="12" fill="var(--muted)">Total</text><text x="74" y="90" textAnchor="middle" fontSize="15" fontWeight="800" fill="var(--fg)">{fmt(total)}</text>

function HBars({data,fmt}){

/* ============ Aides de calcul ============ */
function aggRev(rows,usd){let gen=0,pend=0,conf=0,paid=0;
  rows.forEach(r=>{if(r.status==='declined')return;const c=r.currency||'USD',g=usd(+r.gross||0,c),cf=usd(+r.confirmed||0,c),p=usd(+r.paid||0,c);gen+=g;pend+=Math.max(0,g-cf);conf+=cf;paid+=p});
  return {gen,pend,conf,paid,toPay:Math.max(0,conf-paid)}}
const platKey=n=>/awin/i.test(n||'')?'awin':/amazon/i.test(n||'')?'amazon':'other';

  const M={connected:['good','Connecté'],manual:['','Mode manuel'],error:['bad','Erreur de connexion'],disconnected:['','Non connecté']};

}

/* --- Import de rapports CSV (Awin, Amazon, autre) --- */
function ImportReports({preset}){
  const {db,set,toast}=useApp();
  const [plat,setPlat]=useState(preset),[data,setData]=useState(null),[map,setMap]=useState({}),[defSt,setDefSt]=useState('approved'),[cur,setCur]=useState('USD'),[fname,setFname]=useState('');
  const log=addLogFn(set);
  const guess=h=>{const f=(...res)=>{for(const re of res){const i=h.findIndex(x=>re.test(x));if(i>=0)return i}return ''};
    return {date:f(/date/i,/jour|day/i),product:f(/^(product|name|title|produit|nom)/i,/advertiser|annonceur|merchant|marchand/i,/name|title/i),amount:f(/earning|commission/i,/ad fees|revenue|revenu|gain/i),ref:f(/transaction.?id|order.?id|^id$|ref/i,/asin/i),status:f(/status|statut/i),clicks:f(/clic|click/i),conv:f(/conversion|ordered items|orders|items|qty/i)}};
  const onFile=async file=>{if(!file)return;try{const d=parseCSV(await readFile(file));if(!d.headers.length)throw new Error('vide');setData(d);setMap(guess(d.headers));setFname(file.name)}catch(e){toast('Fichier CSV illisible ou vide','err')}};
  const sel=k=><select className="sel" aria-label={k} value={map[k]??''} onChange={e=>setMap({...map,[k]:e.target.value===''?'':+e.target.value})}><option value="">— ignorer —</option>{data.headers.map((h,i)=><option key={i} value={i}>{h||'(colonne '+(i+1)+')'}</option>)}</select>;
  const stOf=s=>/declin|refus|reject|cancel|annul/i.test(s)?'declined':/paid|pay/i.test(s)?'paid':/approv|valid|confirm|locked|final/i.test(s)?'approved':/pend|attente|open/i.test(s)?'pending':defSt;
  const run=()=>{
    if(map.amount===''&&map.clicks===''){toast('Associez au moins la colonne commission ou la colonne clics','err');return}
    const pk=platKey(plat),pname=plat;let added=0,skipped=0,clickRows=0;
    if(map.amount!==''&&map.amount!==undefined){
      const exist=new Set(db.revenues.filter(r=>platKey(r.platform)===pk).map(r=>r.ref));const batch=[];
      data.rows.forEach(r=>{const gross=num(r[map.amount]);if(!gross)return;const date=map.date!==''?toISO(r[map.date]):today(),product=map.product!==''?r[map.product]:'',st=map.status!==''?stOf(r[map.status]):defSt;
        const ref=(map.ref!==''&&r[map.ref]?'csv-'+r[map.ref]:'csv-'+[date,product,gross].join('|'))+(map.ref!==''?'|'+date+'|'+gross:'');
        if(exist.has(ref)){skipped++;return}exist.add(ref);
        batch.push({id:uid(),date,platform:pname,product,gross,confirmed:st==='approved'||st==='paid'?gross:0,paid:st==='paid'?gross:0,currency:cur,ref,status:st,source:pk==='amazon'?'amazon-csv':pk==='awin'?'awin-csv':'csv',demo:false})});
      set('revenues',a=>[...batch,...a]);added=batch.length}
    if(map.clicks!==''&&map.clicks!==undefined&&map.date!==''){
      const byD={};data.rows.forEach(r=>{const d=toISO(r[map.date]);byD[d]=byD[d]||{c:0,v:0};byD[d].c+=num(r[map.clicks]);if(map.conv!==''&&map.conv!==undefined)byD[d].v+=num(r[map.conv])});
      const cr=Object.entries(byD).map(([date,x])=>({id:uid(),date,platform:pname,clicks:x.c,conversions:x.v,source:'csv',demo:false}));clickRows=cr.length;
      set('clicks',a=>[...cr,...a.filter(x=>!(x.source==='csv'&&x.platform===pname&&cr.some(n=>n.date===x.date)))])}
    if(pk!=='other')set('integrations',o=>({...o,[pk]:{...o[pk],lastImport:Date.now()}}));
    log(pname,'Import CSV',`${fname} : ${added} commissions ajoutées, ${skipped} doublons ignorés, ${clickRows} jours de clics`,true);
    toast(`${added} commissions importées${skipped?` · ${skipped} doublons ignorés`:''}`);setData(null)};
  return <div className="card" style={{display:'flex',flexDirection:'column',gap:14}}>
    <div className="card-h" style={{marginBottom:0}}><h2>Importer un rapport de performance (CSV)</h2></div>
    <p className="sub">Exportez le rapport depuis votre compte (Awin : rapport de transactions ; Amazon Associates : rapport de gains), puis importez-le ici. Les doublons sont ignorés si vous réimportez le même fichier.</p>
    <div className="bar"><label className="lbl" style={{flexDirection:'row',alignItems:'center'}}>Plateforme<select className="sel" value={plat} onChange={e=>setPlat(e.target.value)} style={{width:'auto'}}>{[...new Set([...db.platforms.map(p=>p.name),'Awin','Amazon Associates'])].map(p=><option key={p}>{p}</option>)}</select></label>
      <label className="btn pri"><Icon n="upload" s={15}/>Choisir un fichier CSV<input type="file" accept=".csv,text/csv,text/plain" hidden onChange={e=>{onFile(e.target.files[0]);e.target.value=''}}/></label></div>
    {platKey(plat)==='amazon'&&<Note c="warn" i="info">Les commissions Amazon sont importées uniquement depuis vos rapports. Aucune synchronisation automatique n’existe sans API autorisée.</Note>}
    {data&&<>
      <div className="form">
        {[['date','Date'],['product','Produit ou annonceur'],['amount','Commission'],['ref','Référence'],['status','Statut'],['clicks','Clics'],['conv','Conversions']].map(([k,l])=><label key={k} className="lbl">{l}{sel(k)}</label>)}
        <label className="lbl">Statut par défaut<select className="sel" value={defSt} onChange={e=>setDefSt(e.target.value)}><option value="pending">En attente</option><option value="approved">Validée</option><option value="paid">Payée</option></select></label>

    {redit&&<Modal title={redit.id?'Modifier le revenu':'Ajouter un revenu'} wide onClose={()=>setRedit(null)}><Form fields={RF} initial={redit} onSubmit={saveR} onCancel={()=>setRedit(null)}/></Modal>}
    {eedit&&<Modal title={eedit.id?'Modifier la dépense':'Ajouter une dépense'} onClose={()=>setEedit(null)}><Form fields={EF} initial={eedit} onSubmit={saveE} onCancel={()=>setEedit(null)}/></Modal>}

}
/* ============ Équipe ============ */
function Team(){
  const {db,set,toast,ask}=useApp();
  const [edit,setEdit]=useState(null),[uedit,setUedit]=useState(null),[over,setOver]=useState(''),[own,setOwn]=useState('');
  const uname=id=>(db.users.find(u=>u.id===id)||{}).name||'Non assigné';
  const TF=[{k:'title',label:'Titre',req:true,full:true},{k:'description',label:'Description',type:'textarea'},{k:'owner',label:'Responsable',type:'select',opts:db.users.map(u=>[u.id,u.name])},{k:'priority',label:'Priorité',type:'select',opts:Object.entries(PRIO),req:true},{k:'due',label:'Date limite',type:'date'},{k:'status',label:'Statut',type:'select',opts:COLS,req:true},{k:'comments',label:'Commentaires',type:'textarea'}];
  const UF=[{k:'name',label:'Nom',req:true},{k:'profile',label:'Profil',type:'select',opts:[['commercial','Direction commerciale et marketing'],['finance','Gestion financière']],req:true},{k:'email',label:'E-mail',type:'email'}];
  const save=v=>{set('tasks',a=>v.id?a.map(x=>x.id===v.id?v:x):[...a,{...v,id:uid()}]);setEdit(null);toast('Tâche enregistrée')};
  const move=(id,st)=>set('tasks',a=>a.map(x=>x.id===id?{...x,status:st}:x));
  const saveU=v=>{set('users',a=>v.id?a.map(x=>x.id===v.id?v:x):[...a,{...v,id:uid()}]);setUedit(null);toast('Collaborateur enregistré')};
  const tasks=db.tasks.filter(t=>!own||t.owner===own);
  const P=[{k:'commercial',t:'Direction commerciale et marketing',l:['Gestion du catalogue','Gestion des produits','Marketing','Création des contenus','Réseaux sociaux','Suivi des performances']},{k:'finance',t:'Gestion financière',l:['Suivi des revenus','Gestion des dépenses','Suivi des commissions','Préparation des rapports','Contrôle des paiements']}];
  return <>
    <div className="bar"><div className="grow"><h2 style={{fontSize:20}}>Équipe et responsabilités</h2><p className="sub">Deux profils, un tableau de tâches partagé.</p></div><button className="btn" onClick={()=>setUedit({profile:'commercial'})}><Icon n="plus" s={15}/>Collaborateur</button><button className="btn pri" onClick={()=>setEdit({status:'todo',priority:'moyenne',owner:db.users[0]?.id})}><Icon n="plus" s={15}/>Nouvelle tâche</button></div>
    <div className="grid g2">{P.map(p=><div className="card" key={p.k}><div className="card-h"><h2>{p.t}</h2></div>
      <div className="bar" style={{marginBottom:10}}>{db.users.filter(u=>u.profile===p.k).map(u=><button key={u.id} className="btn sm" onClick={()=>setUedit(u)}><Icon n="users" s={14}/>{u.name}</button>)}{!db.users.some(u=>u.profile===p.k)&&<span className="sub">Aucun collaborateur</span>}</div>
      <ul style={{margin:0,paddingLeft:18,display:'grid',gap:3,gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))'}}>{p.l.map(x=><li key={x}>{x}</li>)}</ul></div>)}</div>
    <Note i="info">Les droits d’accès distincts ne s’appliquent qu’avec une authentification réelle (non active dans cette version locale) : toute personne ouvrant l’application sur cet appareil voit toutes les données.</Note>
    <div className="bar"><b>Tableau des tâches</b><select className="sel" aria-label="Filtrer par responsable" value={own} onChange={e=>setOwn(e.target.value)}><option value="">Tous les responsables</option>{db.users.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></div>
    <div className="kanban">{COLS.map(([k,l])=><div key={k} className={'kcol'+(over===k?' over':'')} onDragOver={e=>{e.preventDefault();setOver(k)}} onDragLeave={()=>setOver('')} onDrop={e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');setOver('');if(id)move(id,k)}}>
      <h3>{l}<span className="badge">{tasks.filter(t=>t.status===k).length}</span></h3>
      {tasks.filter(t=>t.status===k).map(t=>{const late=t.due&&t.due<today()&&t.status!=='done';return <div key={t.id} className="kcard" draggable onDragStart={e=>e.dataTransfer.setData('text/plain',t.id)}>
        <div className="bar" style={{justifyContent:'space-between'}}><Badge c={PRIO_C[t.priority]}>{PRIO[t.priority]}</Badge>{late&&<Badge c="bad">En retard</Badge>}</div>
        <b>{t.title}</b>{t.description&&<span className="sub" style={{fontSize:12.5}}>{t.description}</span>}
        <span className="sub" style={{fontSize:12}}>{uname(t.owner)} · {t.due?'avant le '+fmtDate(t.due):'sans échéance'}</span>
        {t.comments&&<span style={{fontSize:12,background:'var(--surface2)',borderRadius:7,padding:'5px 8px'}}>{t.comments}</span>}
        <div className="bar"><button className="btn sm ico-btn" aria-label="Déplacer à gauche" disabled={k==='todo'} onClick={()=>move(t.id,COLS[COLS.findIndex(c=>c[0]===k)-1][0])}><Icon n="left" s={14}/></button><button className="btn sm ico-btn" aria-label="Déplacer à droite" disabled={k==='done'} onClick={()=>move(t.id,COLS[COLS.findIndex(c=>c[0]===k)+1][0])}><Icon n="right" s={14}/></button><div className="grow"/><button className="btn sm ico-btn" aria-label="Modifier" onClick={()=>setEdit(t)}><Icon n="edit" s={14}/></button><button className="btn sm ico-btn dng" aria-label="Supprimer" onClick={()=>ask(`Supprimer « ${t.title} » ?`,()=>{set('tasks',a=>a.filter(x=>x.id!==t.id));toast('Tâche supprimée')})}><Icon n="trash" s={14}/></button></div></div>})}
    </div>)}</div>
    {edit&&<Modal title={edit.id?'Modifier la tâche':'Nouvelle tâche'} onClose={()=>setEdit(null)}><Form fields={TF} initial={edit} onSubmit={save} onCancel={()=>setEdit(null)}/></Modal>}
    {uedit&&<Modal title={uedit.id?'Modifier le collaborateur':'Nouveau collaborateur'} onClose={()=>setUedit(null)}><Form fields={UF} initial={uedit} onSubmit={saveU} onCancel={()=>setUedit(null)}/>{uedit.id&&db.users.length>1&&<div><button className="btn sm dng" onClick={()=>ask(`Retirer ${uedit.name} ?`,()=>{set('users',a=>a.filter(x=>x.id!==uedit.id));setUedit(null)})}><Icon n="trash" s={14}/>Retirer</button></div>}</Modal>}
  </>;
}

/* ============ Objectifs ============ */
function Goals(){
  const {db,set,usd,m,toast,ask}=useApp();
  const [edit,setEdit]=useState(null);
  const t=today(),k=(new Date().getDay()+6)%7,mon=addDays(t,-k);
  const R={quotidien:[t,t],hebdomadaire:[mon,addDays(mon,6)],mensuel:[t.slice(0,7)+'-01',t]};
  const actual=g=>{const r=R[g.period];if(g.metric==='revenus')return aggRev(db.revenues.filter(x=>inR(x.date,r)),usd).gen;if(g.metric==='publications')return db.posts.filter(p=>p.status==='publie'&&inR(p.date,r)).length;if(g.metric==='partenaires')return db.platforms.filter(p=>p.status==='approuve').length;return +g.current||0};
  const MET={revenus:'Revenus (USD)',publications:'Publications publiées',partenaires:'Plateformes approuvées',manuel:'Suivi manuel'};
  const F=[{k:'title',label:'Objectif',req:true,full:true},{k:'period',label:'Période',type:'select',opts:[['quotidien','Quotidien'],['hebdomadaire','Hebdomadaire'],['mensuel','Mensuel']],req:true},{k:'metric',label:'Type',type:'select',opts:Object.entries(MET),req:true},{k:'target',label:'Cible',type:'number',min:0,req:true},{k:'current',label:'Valeur actuelle (suivi manuel)',type:'number',min:0,show:v=>v.metric==='manuel'}];
  const save=v=>{set('goals',a=>v.id?a.map(x=>x.id===v.id?v:x):[...a,{...v,id:uid()}]);setEdit(null);toast('Objectif enregistré')};
  return <>
    <div className="bar"><div className="grow"><h2 style={{fontSize:20}}>Objectifs et stratégie</h2><p className="sub">La progression est calculée à partir de vos données réelles. Un objectif n’est pas un revenu garanti.</p></div><button className="btn pri" onClick={()=>setEdit({period:'mensuel',metric:'revenus'})}><Icon n="plus" s={15}/>Nouvel objectif</button></div>
    <div className="card"><div className="card-h"><h2>Objectif financier quotidien</h2></div><div className="bar"><span className="sub">Cible par jour (USD)</span><input className="inp" style={{width:110}} type="number" min="0" aria-label="Cible quotidienne" value={db.settings.dailyTarget} onChange={e=>set('settings',s=>({...s,dailyTarget:Math.max(0,+e.target.value||0)}))}/><span className="sub">Utilisée dans le tableau de bord.</span></div></div>
    {['quotidien','hebdomadaire','mensuel'].map(p=>{const gs=db.goals.filter(g=>g.period===p);return gs.length?<div key={p} className="card"><div className="card-h"><h2 style={{textTransform:'capitalize'}}>Objectifs {p==='quotidien'?'quotidiens':p==='hebdomadaire'?'hebdomadaires':'mensuels'}</h2></div>
      <div style={{display:'grid',gap:16}}>{gs.map(g=>{const a=actual(g),pct=g.target?a/g.target*100:0,gap=a-g.target,isM=g.metric==='revenus',f=x=>isM?m(x):Math.round(x*10)/10;return <div key={g.id}><div className="bar" style={{justifyContent:'space-between',marginBottom:6}}><div><b>{g.title}</b><div className="sub" style={{fontSize:12}}>{MET[g.metric]}</div></div><div className="bar"><span className="num"><b>{f(a)}</b> / {f(+g.target)}</span><Badge c={gap>=0?'good':'warn'}>{gap>=0?'Atteint':'Écart '+f(gap)}</Badge><button className="btn sm ico-btn ghost" aria-label="Modifier" onClick={()=>setEdit(g)}><Icon n="edit" s={14}/></button><button className="btn sm ico-btn ghost dng" aria-label="Supprimer" onClick={()=>ask(`Supprimer « ${g.title} » ?`,()=>{set('goals',x=>x.filter(y=>y.id!==g.id));toast('Objectif supprimé')})}><Icon n="trash" s={14}/></button></div></div><Prog v={pct}/></div>})}</div></div>:null})}
    {!db.goals.length&&<div className="card"><Empty icon="target" title="Aucun objectif">Définissez vos objectifs de revenus, de publication et de partenaires.</Empty></div>}
    {edit&&<Modal title={edit.id?'Modifier l’objectif':'Nouvel objectif'} onClose={()=>setEdit(null)}><Form fields={F} initial={edit} onSubmit={save} onCancel={()=>setEdit(null)}/></Modal>}
  </>;
}

        <label className="lbl">Affichage des montants<select className="sel" value={S.cur} onChange={e=>up('cur',e.target.value)}><option value="USD">USD ($)</option><option value="HTG">HTG (gourdes)</option></select></label>
        <label className="lbl">Taux : 1 USD = … HTG<input className="inp" type="number" min="1" value={S.rate} onChange={e=>up('rate',Math.max(1,+e.target.value||1))}/><span className="hint">Taux manuel : mettez-le à jour vous-même.</span></label>
        {['EUR','GBP','CAD'].map(c=><label key={c} className="lbl">1 {c} = … USD<input className="inp" type="number" step="0.01" min="0" value={S.fx[c]} onChange={e=>up('fx',{...S.fx,[c]:+e.target.value||0})}/></label>)}</div>
        <p className="sub" style={{marginTop:10,fontSize:12}}>Les commissions reçues en EUR, GBP ou CAD sont converties en USD avec ces taux indicatifs.</p></div>
      <div className="card"><div className="card-h"><h2>Confidentialité</h2></div>
        <label style={{display:'flex',gap:10,alignItems:'center',marginBottom:10}}><input type="checkbox" checked={S.privacy.hideAmounts} onChange={e=>up('privacy',{...S.privacy,hideAmounts:e.target.checked})}/>Masquer les montants à l’écran</label>
        <p className="sub">Vos données restent dans ce navigateur (stockage local). Aucun suivi publicitaire n’est utilisé. Elles ne sont synchronisées avec aucun autre appareil ni utilisateur.</p></div>
    </div>
    <div className="card"><div className="card-h"><h2>Transparence des liens affiliés</h2></div><label className="lbl">Mention affichée sur les fiches produits<textarea className="txt" value={S.disclosure} onChange={e=>up('disclosure',e.target.value)} rows="2"/></label></div>
    <div className="card"><div className="card-h"><h2>Utilisateurs</h2></div><div className="tbl-wrap"><table><thead><tr><th>Nom</th><th>Profil</th><th>E-mail</th></tr></thead><tbody>{db.users.map(u=><tr key={u.id}><td>{u.name}</td><td>{u.profile==='finance'?'Gestion financière':'Direction commerciale et marketing'}</td><td>{u.email||'—'}</td></tr>)}</tbody></table></div><p className="sub" style={{marginTop:8}}>Modifiez les collaborateurs dans l’onglet Équipe. Aucune connexion par mot de passe n’existe dans cette version locale.</p></div>
    <div className="card"><div className="card-h"><h2>Documents internes et accords</h2><button className="btn sm" onClick={()=>setDedit({kind:'document',date:today()})}><Icon n="plus" s={14}/>Nouveau</button></div>
      {db.docs.length?<div style={{display:'grid',gap:8}}>{db.docs.map(d=><div className="bar" key={d.id} style={{padding:'8px 0',borderBottom:'1px solid var(--line)'}}><Badge c="info">{KIND[d.kind]}</Badge><b className="grow">{d.title}</b><span className="sub">{fmtDate(d.date)}</span><button className="btn sm" onClick={()=>setDedit(d)}><Icon n="edit" s={14}/>Ouvrir</button><button className="btn sm dng ico-btn" aria-label="Supprimer" onClick={()=>ask(`Supprimer « ${d.title} » ?`,()=>{set('docs',a=>a.filter(x=>x.id!==d.id));toast('Document supprimé')})}><Icon n="trash" s={14}/></button></div>)}</div>:<Empty icon="file" title="Aucun document">Ajoutez accords et documents internes.</Empty>}</div>
    <div className="card"><div className="card-h"><h2>Rapports téléchargeables</h2></div><div className="bar">
      <button className="btn" onClick={()=>exportData('revenus',db.revenues,[{h:'Date',v:'date'},{h:'Plateforme',v:'platform'},{h:'Produit',v:'product'},{h:'Brute',v:'gross'},{h:'Confirmée',v:'confirmed'},{h:'Payée',v:'paid'},{h:'Devise',v:'currency'},{h:'Statut',v:r=>REV_STAT[r.status]},{h:'Référence',v:'ref'}])}><Icon n="download" s={15}/>Revenus</button>
      <button className="btn" onClick={()=>exportData('depenses',db.expenses,[{h:'Date',v:'date'},{h:'Catégorie',v:'category'},{h:'Description',v:'description'},{h:'Montant',v:'amount'},{h:'Devise',v:'currency'},{h:'Justificatif',v:'ref'},{h:'Par',v:'person'}])}><Icon n="download" s={15}/>Dépenses</button>
      <button className="btn" onClick={()=>exportData('produits',db.products,[{h:'Nom',v:'name'},{h:'Catégorie',v:'category'},{h:'Prix',v:'price'},{h:'Commission %',v:'rate'},{h:'Plateforme',v:'platform'},{h:'Lien',v:'link'},{h:'Statut',v:p=>PSTAT[p.status]}])}><Icon n="download" s={15}/>Produits</button></div></div>
    <div className="card"><div className="card-h"><h2>Sauvegarde et données</h2></div>
      <p className="sub" style={{marginBottom:12}}>Les données sont enregistrées dans ce navigateur. Exportez une sauvegarde régulièrement : vider les données du navigateur les efface.</p>
      <div className="bar"><button className="btn pri" onClick={showJSON}><Icon n="download" s={15}/>Sauvegarde complète (JSON)</button>
        <label className="btn"><Icon n="upload" s={15}/>Restaurer une sauvegarde<input type="file" accept=".json,application/json" hidden onChange={e=>{importJSON(e.target.files[0]);e.target.value=''}}/></label>
        {db.demoActive&&<button className="btn" onClick={clearDemo}>Supprimer les données de démonstration</button>}
        <button className="btn dng" onClick={reset}><Icon n="trash" s={15}/>Tout réinitialiser</button></div></div>
    {dedit&&<Modal title={dedit.id?'Modifier le document':'Nouveau document'} wide onClose={()=>setDedit(null)}><Form fields={DF} initial={dedit} onSubmit={saveD} onCancel={()=>setDedit(null)}/></Modal>}
  </>;
}
/* ============ Application ============ */
const PAGES=[['accueil','Tableau de bord','home',Dashboard],['produits','Produits','box',Products],['affiliation','Affiliation','link',Affiliation],['marketing','Marketing','mega',Marketing],['finances','Finances','wallet',Finances],['equipe','Équipe','users',Team],['objectifs','Objectifs','target',Goals],['parametres','Paramètres','gear',SettingsPage]];
const pageFromHash=()=>{const h=(location.hash||'').slice(1);return PAGES.some(p=>p[0]===h)?h:'accueil'};

function ExportModal({ex,onClose}){
  const {toast}=useApp();
  const copy=()=>navigator.clipboard?.writeText(ex.text).then(()=>toast('Copié : collez dans Excel ou un éditeur'),()=>toast('Copie bloquée : sélectionnez le texte et copiez-le','err'));
  const xl=()=>{try{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ex.aoa),'Données');dlBlob(ex.name+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'}));toast('Export Excel lancé')}catch(e){toast('Export Excel indisponible : utilisez le CSV','err')}};
  return <Modal title={ex.json?'Sauvegarde complète':'Exporter : '+ex.name} wide onClose={onClose}>
    <Note i="info">Si le téléchargement ne démarre pas (aperçu intégré, navigateur restrictif), utilisez « Copier » puis collez dans un fichier. Le téléchargement direct fonctionne quand l’application est hébergée sur votre propre site.</Note>
    <textarea className="txt mono" readOnly rows="10" value={ex.text} onFocus={e=>e.target.select()} aria-label="Contenu exporté"/>
    <div className="bar" style={{justifyContent:'flex-end'}}><button className="btn" onClick={copy}><Icon n="copy" s={15}/>Copier</button>
      <button className="btn" onClick={()=>{dlBlob(ex.name+(ex.json?'.json':'.csv'),new Blob([ex.json?ex.text:'﻿'+ex.text],{type:ex.json?'application/json':'text/csv;charset=utf-8'}));}}><Icon n="download" s={15}/>Télécharger {ex.json?'JSON':'CSV'}</button>
      {!ex.json&&<button className="btn pri" onClick={xl}><Icon n="download" s={15}/>Télécharger Excel</button>}</div>
  </Modal>;
}

function App(){
  const [db,setDb]=useState(loadDB);
  const [page,setPage]=useState(pageFromHash);
  const [open,setOpen]=useState(false),[bell,setBell]=useState(false);
  const [toasts,setToasts]=useState([]),[conf,setConf]=useState(null),[ex,setEx]=useState(null),[storeErr,setStoreErr]=useState(false);
  useEffect(()=>{try{localStorage.setItem(LS,JSON.stringify(db));setStoreErr(false)}catch(e){setStoreErr(true)}},[db]);
  useEffect(()=>{const h=()=>setPage(pageFromHash());window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);
  const go=p=>{setPage(p);setOpen(false);try{location.hash=p}catch(e){}window.scrollTo(0,0)};
  const set=useCallback((k,fn)=>setDb(d=>({...d,[k]:typeof fn==='function'?fn(d[k]):fn})),[]);
  const toast=useCallback((msg,type='')=>{const id=uid();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),type==='err'?6000:3200)},[]);
  const S=db.settings;
  const usd=useCallback((n,c)=>!c||c==='USD'?n:c==='HTG'?n/S.rate:n*(S.fx[c]||1),[S.rate,S.fx]);
  const m=useCallback(n=>{if(S.privacy.hideAmounts)return '••••';if(S.cur==='HTG')return Math.round(n*S.rate).toLocaleString('fr-FR')+' HTG';return (n<0?'−$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})},[S.cur,S.rate,S.privacy.hideAmounts]);
  const exportData=(name,rows,cols)=>{const text=toCSV(rows,cols);setEx({name,text,aoa:[cols.map(c=>c.h),...rows.map(r=>cols.map(c=>{const v=typeof c.v==='function'?c.v(r):r[c.v];return v==null?'':v}))]})};
  const showJSON=()=>setEx({name:'dsmm-sauvegarde-'+today(),json:true,text:JSON.stringify(db,null,1)});
  const ctx={db,set,setDb,usd,m,toast,ask:(msg,fn)=>setConf({msg,fn}),exportData,showJSON,go};
  /* alertes calculées à partir des données réelles */
  const A=aggRev(db.revenues,usd),late=db.tasks.filter(t=>t.due&&t.due<today()&&t.status!=='done').length;
  const alerts=[];
  if(db.integrations.awin.status!=='connected'&&db.integrations.amazon.status!=='connected')alerts.push(['info','Aucun compte affilié connecté : mode manuel actif.']);
  if(A.pend>0)alerts.push(['warn',`Commissions en attente : ${m(A.pend)}.`]);
  if(A.toPay>0)alerts.push(['good',`Commissions validées à recevoir : ${m(A.toPay)}.`]);
  if(late)alerts.push(['bad',`${late} tâche(s) en retard.`]);
  Object.entries(db.integrations).forEach(([k,i])=>{if(i.status==='error')alerts.push(['bad',`Connexion ${k==='awin'?'Awin':'Amazon'} en erreur.`])});
  const [,title,,Page]=PAGES.find(p=>p[0]===page);
  const demoN=db.revenues.filter(r=>r.demo).length+db.products.filter(r=>r.demo).length;
  return <Ctx.Provider value={ctx}><div className="app">
    <div className={'scrim'+(open?' open':'')} onClick={()=>setOpen(false)}/>
    <aside className={'side'+(open?' open':'')} aria-label="Navigation principale">
      <div className="logo"><div className="logo-mark"><Icon n="leaf" s={20}/></div><div><div className="logo-t">Daily<br/>Smart Market</div></div></div>
      <div className="logo-s" style={{padding:'0 6px 14px'}}>{S.slogan}</div>
      <nav className="nav">{PAGES.map(([k,l,i])=><button key={k} className={page===k?'on':''} aria-current={page===k?'page':undefined} onClick={()=>go(k)}><Icon n={i}/>{l}</button>)}</nav>
      <div className="side-foot">{S.disclosure}</div>
    </aside>
    <div className="main">
      <header className="top"><button className="btn ico-btn menu-btn" aria-label="Ouvrir le menu" onClick={()=>setOpen(true)}><Icon n="menu"/></button><h1>{title}</h1>
        <Seg v={S.cur} onChange={v=>set('settings',s=>({...s,cur:v}))} opts={[['USD','USD'],['HTG','HTG']]}/>
        <div className="bell"><button className="btn ico-btn" aria-label="Alertes" onClick={()=>setBell(b=>!b)}><Icon n="bell"/></button>{alerts.length>0&&<span className="bell-n">{alerts.length}</span>}
          {bell&&<div className="pop"><b>Alertes</b>{alerts.length?alerts.map((a,i)=><Note key={i} c={a[0]==='info'?'':a[0]} i={a[0]==='bad'?'alert':a[0]==='good'?'check':'info'}>{a[1]}</Note>):<span className="sub">Rien à signaler.</span>}</div>}</div>
      </header>
      <main className="page">
        {storeErr&&<Note c="bad" i="alert"><b>Stockage local indisponible.</b> Vos modifications ne seront pas conservées après actualisation. Exportez une sauvegarde depuis Paramètres.</Note>}
        {db.demoActive&&demoN>0&&<div className="demo-bar"><Icon n="info" s={17}/><span style={{flex:1,minWidth:200}}>Données de démonstration : les chiffres affichés sont fictifs jusqu’à la saisie de vos données réelles.</span><button className="btn sm" onClick={()=>go('parametres')}>Les supprimer dans Paramètres</button></div>}
        <Page/>
      </main>
    </div>
    {conf&&<Modal title="Confirmation" onClose={()=>setConf(null)}><p>{conf.msg}</p><div className="bar" style={{justifyContent:'flex-end'}}><button className="btn" onClick={()=>setConf(null)}>Annuler</button><button className="btn pri" onClick={()=>{const f=conf.fn;setConf(null);f()}}>Confirmer</button></div></Modal>}
    {ex&&<ExportModal ex={ex} onClose={()=>setEx(null)}/>}
    <div className="toasts" aria-live="polite">{toasts.map(t=><div key={t.id} className={'toast'+(t.type==='err'?' err':'')}><Icon n={t.type==='err'?'alert':'check'} s={16}/>{t.msg}</div>)}</div>
  </div></Ctx.Provider>;
}
class Boundary extends React.Component{
  constructor(p){super(p);this.state={e:null}}
  static getDerivedStateFromError(e){return {e}}
  render(){return this.state.e?<div style={{padding:24}}><h2>Une erreur est survenue</h2><p style={{margin:'10px 0'}}>{String(this.state.e.message||this.state.e)}</p><button className="btn pri" onClick={()=>this.setState({e:null})}>Réessayer</button></div>:this.props.children}
}
ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App/></Boundary>);
</script>
